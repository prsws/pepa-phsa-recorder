<tr id="medication-{{ m.id }}">
  <td>{{ m.medication_text }}</td>
  <td>{{ m.status }}</td>
  <td><span class="eff-tag">{{ m.effective_class }}</span></td>
  <td>
    <a class="button secondary" href="/medications/{{ m.id }}/supersede">Supersede (new version)</a>
    {% if m.status != "entered-in-error" %}
    <form method="post" action="/medications/{{ m.id }}/mark-error">
      <button type="submit" class="button secondary">Mark entered-in-error</button>
    </form>
    {% endif %}
  </td>
</tr>
{% if with_add_row %}{% include "_medication_add_row.html" %}{% endif %}
